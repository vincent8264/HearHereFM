[project]
name = "hackathon-starter"
version = "0.1.0"
description = "Minimal cross-platform FastAPI hackathon starter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av<19",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-python"]
